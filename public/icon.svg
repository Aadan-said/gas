<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Droplet Body Gradient -->
    <linearGradient id="primaryFlowGrad" x1="20%" y1="95%" x2="80%" y2="5%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="75%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="coreFlameGrad" x1="30%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Slate/Navy Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#0A0F1D"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="#1E293B" stroke-width="6"/>

  <!-- Radial Atmosphere Glow -->
  <circle cx="256" cy="280" r="160" fill="url(#haloGlow)"/>

  <!-- Left Dynamic Swoosh -->
  <path d="M 175 340 C 155 310, 148 270, 165 230 C 172 215, 188 192, 205 175 C 196 198, 188 226, 195 254 C 200 276, 215 300, 230 320 C 208 332, 190 338, 175 340 Z"
        fill="#38BDF8" opacity="0.45" />

  <!-- Master Droplet Body -->
  <path d="M 256 82
           C 240 138, 202 200, 170 248
           C 136 298, 120 342, 120 384
           C 120 458, 180 500, 256 500
           C 332 500, 392 458, 392 384
           C 392 342, 376 298, 342 248
           C 310 200, 272 138, 256 82 Z"
        transform="translate(0, -28) scale(1, 0.96)"
        transform-origin="256 256"
        fill="url(#primaryFlowGrad)"/>

  <!-- Inner Dynamic Flame Vortex Core -->
  <path d="M 256 182
           C 248 218, 224 256, 206 288
           C 188 320, 180 346, 180 370
           C 180 414, 214 446, 256 446
           C 298 446, 332 414, 332 370
           C 332 346, 324 320, 306 288
           C 288 256, 264 218, 256 182 Z"
        transform="translate(0, -26) scale(1, 0.94)"
        transform-origin="256 256"
        fill="url(#coreFlameGrad)"/>

  <!-- Teardrop Seed Highlight -->
  <circle cx="256" cy="336" r="26" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Sheen Highlight Curve -->
  <path d="M 256 112
           C 270 156, 302 210, 324 248
           C 340 278, 348 308, 350 336
           C 340 310, 322 278, 304 250
           C 280 214, 256 168, 246 128
           C 249 122, 252 116, 256 112 Z"
        fill="#FFFFFF"
        fill-opacity="0.65"/>
</svg>